<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人名片</title>
  <!-- 引入外部样式表，实现结构与样式分离 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 名片主容器，用于居中显示 -->
  <div class="card-wrapper">

    <!-- 名片卡片 -->
    <div class="card">

      <!-- 圆形头像区域 -->
      <div class="avatar">
        <!-- 可替换为真实头像图片路径，此处使用占位图 -->
        <img src="https://i.pravatar.cc/200" alt="头像">
      </div>

      <!-- 姓名 -->
      <h1 class="name">张三</h1>

      <!-- 职位 -->
      <p class="title">前端开发工程师</p>

      <!-- 分割线 -->
      <div class="divider"></div>

      <!-- 联系方式列表 -->
      <ul class="contact-list">
        <li>
          <span class="icon">📧</span>
          <span>zhangsan@example.com</span>
        </li>
        <li>
          <span class="icon">📱</span>
          <span>+86 138-0000-0000</span>
        </li>
        <li>
          <span class="icon">📍</span>
          <span>中国 · 上海</span>
        </li>
      </ul>

    </div>

  </div>

</body>
</html>
